# Copy to configs/app.local.yaml and set storage addresses for your environment.
# Credentials are loaded from environment variables; do not put secrets in this file.
# This example uses the OpenRouter long-contract profile (180-second retrieval budget).
data_root: /srv/knowledge-graph/data
host: 127.0.0.1
port: 8000
neo4j_uri: bolt://127.0.0.1:7687
neo4j_user: neo4j
neo4j_password_env: NEO4J_PASSWORD
neo4j_database: neo4j
postgres_dsn_env: POSTGRES_DSN
# Enable this section together with --role prepare and --role publish.
# worker_distribution:
#   redis_url_env: REDIS_URL
#   stream: "kg:{prepare}:stream"
#   group: prepare
#   heartbeat_seconds: 10
#   claim_idle_seconds: 60
#   minio_endpoint: http://127.0.0.1:9000
#   minio_bucket: knowledge-graph
#   minio_access_key_env: MINIO_ACCESS_KEY
#   minio_secret_key_env: MINIO_SECRET_KEY
qdrant_url: http://127.0.0.1:6333
qdrant_api_key_env: QDRANT_API_KEY
upload_limit: 20971520
chunk_target: 1200
chunk_max: 2000
chunk_overlap: 150
chunk_similarity_threshold: 0.97
chunk_decision_model: typesafe/jev-1.13
drain_timeout: 30
poll_interval: 1
graph_timeout: 3
retrieval_timeout: 180
candidate_scan_limit: 5000
maintenance_scan_limit: 100000
detail_max_chars: 1000000
checkpoint_retention_hours: 24
llm:
  provider: openai
  base_url: https://openrouter.ai/api/v1
  model: z-ai/glm-5.3
  api_key_env: OPENROUTER_API_KEY
  timeout: 180
  max_input_chars: 240000
  max_output_tokens: 12000
  structured_output: json_object
  extra_body:
    reasoning:
      effort: low
    provider:
      require_parameters: true
      order:
      - z-ai
      - deepinfra
      - fireworks
      ignore:
      - alibaba
      allow_fallbacks: true
  stream: true
construction_llm:
  provider: openai
  base_url: https://openrouter.ai/api/v1
  model: z-ai/glm-5.3
  api_key_env: OPENROUTER_API_KEY
  timeout: 600
  max_input_chars: 240000
  max_output_tokens: 64000
  structured_output: json_object
  extra_body:
    reasoning:
      effort: low
    provider:
      require_parameters: true
      order:
      - z-ai
      - deepinfra
      - fireworks
      ignore:
      - alibaba
      allow_fallbacks: true
  stream: true
embedding:
  provider: openai
  base_url: https://openrouter.ai/api/v1
  model: google/gemini-embedding-2
  dimension: 3072
  distance: Cosine
  api_key_env: OPENROUTER_API_KEY
  batch_size: 10
  timeout: 90
  extra_body: {}
rerank_enabled: true
rerank_candidate_limit: 80
rerank_timeout: 60
