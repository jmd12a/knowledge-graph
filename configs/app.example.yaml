# Copy to an application config file and set KG_CONFIG to its absolute Linux path.
# Secrets are read from named environment variables, never from this file.
data_root: /srv/knowledge-graph/data
host: 127.0.0.1
port: 8000
neo4j_uri: bolt://127.0.0.1:7687
neo4j_user: neo4j
neo4j_password_env: NEO4J_PASSWORD
neo4j_database: neo4j
qdrant_url: http://127.0.0.1:6333
qdrant_api_key_env: QDRANT_API_KEY
upload_limit: 20971520
chunk_target: 1200
chunk_max: 2000
chunk_overlap: 150
drain_timeout: 30
poll_interval: 1
graph_timeout: 3
retrieval_timeout: 15
candidate_scan_limit: 5000
maintenance_scan_limit: 100000
detail_max_chars: 1000000
checkpoint_retention_hours: 24
llm:
  provider: bailian
  # Use the endpoint assigned to your workspace and region.
  base_url: https://YOUR-WORKSPACE.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
  model: qwen3.7-plus
  api_key_env: DASHSCOPE_API_KEY
  # Long structured extraction can need a larger provider timeout; retrieval has its own total budget.
  timeout: 60
  # Unicode character budget for the complete serialized request, including prompts and output schema.
  max_input_chars: 60000
  max_output_tokens: 8000
  structured_output: json_object
  # For Qwen models that support this vendor option, set extra_body: {enable_thinking: false}
  # to disable thinking during structured extraction; check the selected model/provider first.
  extra_body: {}
# Optional complete LanguageProfile for background construction; null reuses llm and its client.
# Configure provider-supported reasoning limits here while keeping API planning on llm.
# For a compatible Qwen model, a separate profile can use:
#   timeout: 180
#   extra_body: {enable_thinking: true, thinking_budget: 1024}
construction_llm: null
embedding:
  provider: bailian
  base_url: https://YOUR-WORKSPACE.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
  model: qwen3.7-text-embedding
  dimension: 1024
  distance: Cosine
  api_key_env: DASHSCOPE_API_KEY
  batch_size: 10
  timeout: 60
  extra_body: {}