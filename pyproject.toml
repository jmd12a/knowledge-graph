[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "knowledge-graph"
version = "0.1.0"
description = "Configurable knowledge graph with source-backed maintenance and retrieval"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.162.0", "uvicorn==0.38.0", "pydantic==2.14.2",
  "httpx==0.28.1", "jsonschema==4.26.0", "neo4j==6.4.1", "qdrant-client==1.20.0",
  "mcp==1.30.0", "pypdf==6.1.3", "PyYAML==6.0.3",
  "python-multipart==0.0.20", "python-dotenv==1.2.1", "typer==0.20.0"
]

[project.optional-dependencies]
dev = ["ruff==0.14.3"]

[project.scripts]
kg = "knowledge_graph.interfaces.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/knowledge_graph"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
